<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFG Puzzle Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-BVQZGotY.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-AnmgLbCb.css">
</head>
<body>
  <!-- Overlay and Side Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="side-drawer" id="side-drawer">
    <div class="drawer-header">
      <h2>Filters & Options</h2>
      <button class="drawer-close" id="drawer-close">✖</button>
    </div>

    <div class="drawer-section">
      <h3 class="drawer-section-title">Show / Hide Columns</h3>
      <label class="matte-checkbox menu-item">
        <input type="checkbox" class="col-toggle" value="note" checked>
        <span class="checkmark"></span> Notes
      </label>
      <label class="matte-checkbox menu-item">
        <input type="checkbox" class="col-toggle" value="tags" checked>
        <span class="checkmark"></span> Tags
      </label>
      <label class="matte-checkbox menu-item">
        <input type="checkbox" class="col-toggle" value="category" checked>
        <span class="checkmark"></span> Category
      </label>
    </div>

    <div class="drawer-section">
      <h3 class="drawer-section-title">Options</h3>
      <label class="matte-checkbox menu-item">
        <input type="checkbox" id="random-btn-toggle" checked>
        <span class="checkmark"></span> Show Random Button
      </label>
    </div>

    <div class="drawer-section" style="margin-top: auto; padding-bottom: 2rem;">
      <button class="matte-btn btn-danger" id="reset-progress-btn">Reset All Progress</button>
    </div>
  </div>

  <!-- Add Question Modal -->
  <div class="modal-overlay" id="add-modal-overlay"></div>
  <div class="modal" id="add-modal">
    <div class="modal-header">
      <h2>Add Custom Puzzle</h2>
      <button class="modal-close" id="add-modal-close">✖</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Puzzle URL</label>
        <input type="url" id="custom-url" class="matte-input" placeholder="https://practice.geeksforgeeks.org/..." required>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="custom-title" class="matte-input" placeholder="e.g., Trapping Rain Water" required>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="custom-category" class="matte-input" placeholder="e.g., Arrays" required>
      </div>
      <button class="matte-btn btn-primary" id="save-custom-btn" style="width: 100%; margin-top: 1rem;">Save Question</button>
    </div>
  </div>

  <div class="app-container">
    <header class="site-header">
      <div class="header-left">
        <button class="hamburger-btn" id="hamburger-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <h1 class="brand-title">GFG Practice</h1>
      </div>
      <div class="header-right">
        <div class="top-indicator">
          <span class="unsolved-count" id="unsolved-count">0</span> remaining
          <span class="separator">|</span>
          <span class="solved-count" id="solved-count">0</span> solved
        </div>
        <button class="matte-btn btn-primary btn-add" id="open-add-modal-btn">
          <span>+ Add</span>
        </button>
      </div>
    </header>

    <div class="two-box-layout">
      <!-- LEFT BOX: Controls -->
      <div class="control-box left-box glass-panel">
        <div class="box-title">CONTROLS</div>
        <div class="box-content">
          <div class="controls-top-row">
            <div class="custom-dropdown" id="tag-filter-dropdown">
              <button class="dropdown-btn">Filter by Tag <span class="arrow">▼</span></button>
              <div class="dropdown-menu" id="tag-filter-menu">
                <!-- populated by JS -->
              </div>
            </div>

            <label class="matte-checkbox">
              <input type="checkbox" id="show-notes-filter">
              <span class="checkmark"></span>
              Show Notes
            </label>
          </div>

          <button class="matte-btn random-btn" id="random-btn">🎲 Random Challenge</button>
        </div>
      </div>

      <!-- RIGHT BOX: Heatmap -->
      <div class="control-box right-box glass-panel">
        <div class="box-title">ACTIVITY (LAST 14 DAYS)</div>
        <div class="heatmap-wrapper">
          <div class="heatmap-container" id="heatmap">
            <!-- SVG Heatmap injected here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Container for the random question row -->
    <div id="currently-solving-container"></div>
    <div id="random-question-container"></div>

    <main class="main-content" id="puzzles-container">
      <!-- Puzzles injected here -->
    </main>
  </div>
  
</body>
</html>
